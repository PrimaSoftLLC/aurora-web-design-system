<!-- @dsCard name="Плотность интерфейса" group="2 · Основы" height=540 aliases="плотность|density|cozy|compact" subtitle="Одинаковые компоненты в cozy и compact; поиск и сортировка синхронизированы" page -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Плотность интерфейса</title><style>
html,body{margin:0}*{box-sizing:border-box}
body{font:var(--ds-type-body);color:var(--ds-fg);background:var(--ds-bg);padding:24px;max-width:1180px;margin:0 auto;-webkit-font-smoothing:antialiased}
.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
.sample{min-width:0}
.sample-heading{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.sample-heading h2{font:var(--ds-type-section);color:var(--ds-fg-strong);margin:0}
.sample p{margin:0 0 16px;color:var(--ds-fg-muted);font:var(--ds-type-caption)}
code{font:var(--ds-type-mono)}
.sample-heading code{color:var(--ds-fg-subtle)}
.metrics{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--ds-fg-muted);font:var(--ds-type-caption)}
@media(max-width:720px){body{padding:16px}.comparison{grid-template-columns:minmax(0,1fr)}}
</style></head><body><div id="root"></div><script type="text/babel">
const { DsPanel, DsField, DsButton, DsTable } = window.AuroraWebDesignSystem_96e210;
const rows = [
  { id: 1, name: 'MAZ 5440', speed: 62 },
  { id: 2, name: 'Volvo FH16', speed: 0 },
  { id: 3, name: 'GAZ Next', speed: 41 },
  { id: 4, name: 'Renault T', speed: 0 },
];
const columns = [
  { key: 'name', label: 'Объект', strong: true, sortable: true },
  { key: 'speed', label: 'Скорость, км/ч', mono: true, align: 'right', sortable: true },
];
function App() {
  const [query, setQuery] = React.useState('');
  const [sort, setSort] = React.useState({ key: 'name', dir: 'asc' });
  const visible = rows.filter(row => row.name.toLowerCase().includes(query.trim().toLowerCase()))
    .sort((a, b) => (sort.key === 'name' ? a.name.localeCompare(b.name) : a.speed - b.speed) * (sort.dir === 'asc' ? 1 : -1));
  return <main>
    <div className="comparison">
      {['cozy', 'compact'].map(density => <section key={density} className="sample" data-ds-density={density} aria-labelledby={'heading-' + density}>
        <div className="sample-heading">
          <h2 id={'heading-' + density}>{density === 'cozy' ? 'Обычная' : 'Компактная'}</h2><code>{density}</code>
        </div>
        <p>{density === 'cozy' ? 'Для повседневной работы и форм.' : 'Для насыщенных данными рабочих экранов.'}</p>
        <DsPanel title="Объекты" bodyStyle={{ gap: 'var(--ds-gap-md)' }}
          actions={<DsButton tone="secondary" onClick={() => setQuery('')}>Сбросить</DsButton>}
          footer={<div className="metrics">
            <span>Строка <code>{density === 'cozy' ? '44' : '34'}px</code></span>
            <span>Кнопка <code>{density === 'cozy' ? '36' : '30'}px</code></span>
            <span>Поле <code>{density === 'cozy' ? '40' : '32'}px</code></span>
          </div>}>
          <DsField id={'search-' + density} label="Поиск объекта" icon="search" placeholder="Название объекта"
            value={query} onChange={event => setQuery(event.target.value)} />
          <DsTable columns={columns} rows={visible} sortKey={sort.key} sortDir={sort.dir}
            onSort={(key, dir) => setSort({ key, dir })} empty="Объекты не найдены" />
        </DsPanel>
      </section>)}
    </div>
  </main>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
