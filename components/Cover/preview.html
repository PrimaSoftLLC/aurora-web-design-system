<!-- @dsCard height=320 -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { background: var(--ds-bg); }
  .cover { position: relative; width: 960px; height: 320px; overflow: hidden; background: var(--ds-bg); }
  .cover svg { position: absolute; left: 0; top: 0; }
  .brand { fill: var(--ds-brand); }
  .ink { fill: var(--ds-surface-inverse); }
  .accent { fill: var(--ds-accent); }
  .tint { fill: var(--ds-brand-border); }
  .signal { fill: var(--ds-state-moving); }
  .blk { rx: var(--ds-radius-container); }
  .arc { fill: none; stroke: var(--ds-accent); stroke-width: var(--ds-gap-sm); stroke-linecap: round; }
  .text { position: absolute; left: 48px; top: 144px; right: 48px; }
  .name { margin: 0; white-space: nowrap; font-family: var(--ds-font-sans, var(--font-ds-font-sans)); font-weight: var(--ds-weight-semibold); font-size: 64px; line-height: .95; letter-spacing: var(--ds-tracking-tight); color: var(--ds-fg-strong); }
  .tag { margin: 8px 0 0; max-width: 440px; font-family: var(--ds-font-sans, var(--font-ds-font-sans)); font-size: 14px; line-height: 1.35; color: var(--ds-fg-muted); }
</style>
</head>
<body>
<div class="cover">
  <svg width="960" height="320" viewBox="0 0 960 320" aria-hidden="true">
    <!--
      blocks:   ds-brand 432 · ds-surface-inverse 192 · ds-accent 120 · ds-brand-border (the relief tint) 120 · ds-state-moving 64 (bleeds right); all 124 tall, bleed 12 off the top
      arrange:  top-band skeleton (name too wide for the 440 zone at 64px): a strip of unequal bands, gaps ds-gap-sm, bottom corners ds-radius-container, like panels under the neutral header
      pattern:  literal motif — the mark's three radiating yellow arcs: three ds-accent arcs + hub on the ds-brand slab, where the README puts the logo ("always on ds-brand")
      scales:   gap ds-gap-sm (8), arc pitch ds-gap-lg (24: r 24/48/72), stroke ds-gap-sm, corner ds-radius-container (12), insets 2 × ds-gap-lg (48)
    -->
    <defs><clipPath id="slab"><rect x="0" y="-12" width="432" height="124" rx="12"/></clipPath></defs>
    <rect class="brand blk"  x="0"   y="-12" width="432" height="124"/>
    <rect class="ink blk"    x="440" y="-12" width="192" height="124"/>
    <rect class="accent blk" x="640" y="-12" width="120" height="124"/>
    <rect class="tint blk"   x="768" y="-12" width="120" height="124"/>
    <rect class="signal blk" x="896" y="-12" width="76"  height="124"/>
    <g clip-path="url(#slab)">
      <path class="arc" d="M 336 112 A 24 24 0 0 1 384 112"/>
      <path class="arc" d="M 312 112 A 48 48 0 0 1 408 112"/>
      <path class="arc" d="M 288 112 A 72 72 0 0 1 432 112"/>
      <circle class="accent" cx="360" cy="112" r="8"/>
    </g>
  </svg>
  <div class="text">
    <h1 class="name">Aurora Web<br>Design System</h1>
    <p class="tag">Плотный интерфейс GPS-мониторинга автопарка.</p>
  </div>
</div>
</body>
</html>
